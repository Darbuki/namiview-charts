apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "namiview-worker.connectionSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "namiview-worker.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.vault.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.vault.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "namiview-worker.connectionSecretName" . }}
  data:
    - secretKey: MONGO_USER
      remoteRef:
        key: {{ .Values.vault.paths.mongodb }}
        property: username
    - secretKey: MONGO_PASSWORD
      remoteRef:
        key: {{ .Values.vault.paths.mongodb }}
        property: password
    - secretKey: MONGO_DB
      remoteRef:
        key: {{ .Values.vault.paths.mongodbDb }}
        property: name
