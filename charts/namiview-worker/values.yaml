replicaCount: 1

image:
  repository: darbuki/namiview-worker
  tag: latest
  pullPolicy: IfNotPresent

revisionHistoryLimit: 3

serviceAccount:
  create: true
  name: ""
  annotations: {}

# SQS job queue URL — required, set per-env in apps-eks-{dev,prod}/<...>/values.yaml.
jobs:
  queueUrl: ""

# S3-only on EKS. No MinIO support in this chart.
storage:
  s3:
    bucket: ""
    region: "eu-west-1"

app:
  mongo:
    atlas: true
    host: ""
    appName: ""
    # Override MONGO_COLLECTION env (images). Empty default = MongoStorage falls back to "images".
    collection: ""
    # Override JOBS_COLLECTION env. Empty default = JobsRepository falls back to "jobs".
    jobsCollection: ""
  # Model feature flags: comma-list of canonical keys to enable (e.g.
  # "physics-light,nami-v2"). Empty = code default (the 5 prod variants). Set
  # per-env in apps-homelab*/namiview-worker/values.yaml.
  enabledModels: ""

vault:
  clusterSecretStore: aws-secrets-manager
  refreshInterval: "1h"
  paths:
    mongodb: namiview-prod/mongodb
    mongodbDb: namiview-prod/mongodb

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# Container hardening (namiview-charts security audit). The worker decodes
# attacker-supplied images, so confine the blast radius of a decoder exploit.
# Safe subset only — readOnlyRootFilesystem / runAsNonRoot are deferred until
# validated against the image-processing temp-file + Dockerfile USER needs.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}

imagePullSecrets: []

aws:
  staticCredentials:
    enabled: false
    secretName: aws-credentials

# Prometheus metrics scraped from the worker pod. The runner starts an HTTP
# server on this port at boot (see start_metrics_server in monitoring/metrics.py).
metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
