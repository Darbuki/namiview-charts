{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "namiview-triage.githubSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "namiview-triage.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecrets.clusterSecretStore must be set" .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "namiview-triage.githubSecretName" . }}
  data:
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: {{ required "externalSecrets.paths.github must be set" .Values.externalSecrets.paths.github }}
        property: GITHUB_TOKEN
{{- end }}
