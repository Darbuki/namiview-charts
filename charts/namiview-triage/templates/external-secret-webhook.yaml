{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.paths.webhookToken }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "namiview-triage.webhookSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "namiview-triage.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ required "externalSecrets.clusterSecretStore must be set" .Values.externalSecrets.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ include "namiview-triage.webhookSecretName" . }}
  data:
    - secretKey: TRIAGE_WEBHOOK_TOKEN
      remoteRef:
        key: {{ .Values.externalSecrets.paths.webhookToken }}
        property: TRIAGE_WEBHOOK_TOKEN
{{- end }}
