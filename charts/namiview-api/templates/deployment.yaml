apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "namiview-api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "namiview-api.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "namiview-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "namiview-api.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "namiview-api.fullname" .) }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # securityContext:
      #   runAsNonRoot: true
      #   runAsUser: 1000
      #   runAsGroup: 3000
      #   fsGroup: 2000
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: {{ .Values.startupProbe.httpGet.path }}
              port: {{ .Values.startupProbe.httpGet.port }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.httpGet.path }}
              port: {{ .Values.readinessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.httpGet.path }}
              port: {{ .Values.livenessProbe.httpGet.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}            
          env:
            # ── Environment posture ────────────────────────────────────────
            # Turns on the API's fail-closed guards (reject default JWT secret,
            # Secure cookies). Every chart deployment is a real (non-local) env,
            # so default to production; override via app.environment if needed.
            - name: NAMIVIEW_ENV
              value: {{ .Values.app.environment | default "production" | quote }}
            # ── MongoDB ────────────────────────────────────────────────────
            - name: MONGO_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "namiview-api.connectionSecretName" . }}
                  key: MONGO_USER
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "namiview-api.connectionSecretName" . }}
                  key: MONGO_PASSWORD
            - name: MONGO_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "namiview-api.connectionSecretName" . }}
                  key: MONGO_DB
            # MONGO_USER, MONGO_PASSWORD, MONGO_DB must be defined above
            # for Kubernetes $(VAR) interpolation to work here.
            - name: MONGO_URI
              value: {{ include "namiview-api.mongoUri" . | quote }}
            {{- if .Values.app.mongo.collection }}
            - name: MONGO_COLLECTION
              value: {{ .Values.app.mongo.collection | quote }}
            {{- end }}
            {{- if .Values.app.mongo.jobsCollection }}
            - name: JOBS_COLLECTION
              value: {{ .Values.app.mongo.jobsCollection | quote }}
            {{- end }}
            {{- if .Values.jobs.queueUrl }}
            - name: JOBS_QUEUE_URL
              value: {{ .Values.jobs.queueUrl | quote }}
            {{- end }}
            {{- if .Values.app.enabledModels }}
            - name: ENABLED_MODELS
              value: {{ .Values.app.enabledModels | quote }}
            {{- end }}
            # ── Storage ────────────────────────────────────────────────────
            - name: STORAGE_BACKEND
              value: {{ .Values.storage.backend | quote }}
            {{- if eq .Values.storage.backend "s3" }}
            - name: S3_BUCKET
              value: {{ .Values.storage.s3.bucket | quote }}
            - name: AWS_REGION
              value: {{ .Values.storage.s3.region | quote }}
            {{- if .Values.aws.staticCredentials.enabled }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws.staticCredentials.secretName | default "aws-credentials" }}
                  key: access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.aws.staticCredentials.secretName | default "aws-credentials" }}
                  key: secret-access-key
            {{- end }}
            {{- else }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.app.minio.endpoint | quote }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "namiview-api.connectionSecretName" . }}
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "namiview-api.connectionSecretName" . }}
                  key: MINIO_SECRET_KEY
            - name: MINIO_BUCKET
              valueFrom:
                secretKeyRef:
                  name: {{ include "namiview-api.connectionSecretName" . }}
                  key: MINIO_BUCKET
            - name: MINIO_SECURE
              valueFrom:
                secretKeyRef:
                  name: {{ include "namiview-api.connectionSecretName" . }}
                  key: MINIO_SECURE
            {{- end }}
            - name: GOOGLE_REDIRECT_URI
              value: {{ .Values.app.googleRedirectUri | quote }}
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/app/google_credentials.json"
            - name: CORS_ORIGINS
              value: {{ .Values.app.corsOrigins | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "namiview-api.jwtSecretName" . }}
                  key: JWT_SECRET
          volumeMounts:
            - name: google-creds
              mountPath: "/app/google_credentials.json"
              subPath: "google_credentials.json"
              readOnly: true
          #   - name: tmp
          #     mountPath: /tmp
          # securityContext:
          #   allowPrivilegeEscalation: false
          #   readOnlyRootFilesystem: true
          #   capabilities:
          #     drop:
          #       - ALL
      volumes:
        # - name: tmp
        #   emptyDir: {}
        - name: google-creds
          secret:
            secretName: {{ include "namiview-api.googleCredsSecretName" . }}
            items:
              - key: "google-creds.json"
                path: "google_credentials.json"