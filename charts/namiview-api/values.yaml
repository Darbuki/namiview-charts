# Default values for namiview.
# Override with values-dev.yaml or values-prod.yaml.

replicaCount: 1

image:
  repository: darbuki/namiview-api
  tag: latest
  pullPolicy: IfNotPresent

revisionHistoryLimit: 3

# Application-level configuration
app:
  googleRedirectUri: "https://namiview.com/api/auth/callback"
  corsOrigins: "https://namiview.com"
  # Native (iOS) Google sign-in. Google issues a SEPARATE client for installed
  # apps — no client secret, and it only accepts the reversed-client-id
  # redirect. The server derives GOOGLE_NATIVE_REDIRECT_URI from this, so the
  # app and server cannot drift. Not a secret: an iOS client id ships inside
  # every copy of the app binary, so it lives here rather than in Secrets
  # Manager. Empty = native sign-in falls back to the legacy path (inert).
  googleIosClientId: ""
  # Model feature flags: comma-list of canonical keys to enable (empty = the 5
  # prod variants). Set per-env in apps-homelab*/namiview-api/values.yaml.
  enabledModels: ""

  minio:
    endpoint: "minio.namiview-infra.svc.cluster.local:9000"

  mongo:
    atlas: false
    host: ""
    appName: ""
    collection: ""
    jobsCollection: ""
    hosts:
      - "mongo-mongodb-0.mongo-mongodb-headless.namiview-infra.svc.cluster.local:27017"
      - "mongo-mongodb-1.mongo-mongodb-headless.namiview-infra.svc.cluster.local:27017"
      - "mongo-mongodb-2.mongo-mongodb-headless.namiview-infra.svc.cluster.local:27017"
    replicaSet: "rs0"
    authSource: "admin"

# Storage backend: "minio" (default, homelab) or "s3" (EKS)
storage:
  backend: minio
  s3:
    bucket: ""
    region: ""

# Async job queue (SQS). Set per-env. Empty = endpoint returns 503.
jobs:
  queueUrl: ""

# Service account for IRSA (EKS) or default
serviceAccount:
  create: false
  name: ""
  annotations: {}

# Ingress configuration
ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  pathType: Prefix
  annotations: {}

# Service configuration
service:
  type: ClusterIP
  port: 8000
  targetPort: 8000
  sessionAffinity: ClientIP
  sessionAffinityTimeoutSeconds: 3600

# Vault / External Secrets configuration
vault:
  clusterSecretStore: vault-cluster-gateway
  refreshInterval: "1h"
  paths:
    mongodb: namiview/infra/mongodb/root
    mongodbDb: namiview/infra/mongodb/db
    minio: namiview/infra/minio/root
    minioBucket: namiview/infra/minio/bucket
    minioSecure: namiview/infra/minio/secure
    googleCreds: namiview/app/google_creds.json
    jwt: namiview/app/jwt

# Prometheus metrics
metrics:
  enabled: true
  port: 9090
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

# Grafana dashboard (auto-discovered via sidecar)
grafanaDashboard:
  enabled: true

# Network policy (disabled by default — enable in prod when ready)
networkPolicy:
  enabled: false

startupProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: 8000
  failureThreshold: 30
  periodSeconds: 10
  timeoutSeconds: 10

livenessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  enabled: true
  httpGet:
    path: /api/health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 3

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 2Gi

# Container hardening (namiview-charts#12). Safe subset — the API binds an
# unprivileged port (8000), so dropping all caps is fine. readOnlyRootFilesystem
# / runAsNonRoot deferred pending validation of temp-file + credential-unwrap paths.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

PodDisruptionBudget:
  enabled: true
  minAvailable: 1
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    memory:
      enabled: true
      utilization: 70
# Image pull secrets — populate when pulling from a private registry that
# requires per-pod credentials (e.g. ECR on a non-EKS cluster where IRSA
# isn't available; the regcred secret is refreshed by a CronJob).
imagePullSecrets: []
# - name: regcred

# AWS access for storage.backend=s3 / SQS jobs. On EKS use IRSA (the
# serviceAccount role-arn annotation); on non-EKS clusters set enabled=true
# to mount AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY from a k8s secret.
aws:
  staticCredentials:
    enabled: false
    secretName: aws-credentials
